<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menü</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #14100c;
      color: #f0e9df;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      padding: 24px 0 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    header p {
      margin-top: 6px;
      font-size: 13px;
      color: #a89880;
      letter-spacing: 1px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c9a86a;
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #3a3128;
    }

    .item {
      display: flex;
      gap: 14px;
      background: #1e1913;
      border: 1px solid #2c251c;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .item img {
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      background: #2c251c;
    }

    .item-info { flex: 1; min-width: 0; }

    .item-info h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .item-info p {
      font-size: 13px;
      color: #a89880;
      margin-top: 3px;
    }

    .price {
      font-size: 16px;
      font-weight: 700;
      color: #c9a86a;
      white-space: nowrap;
      padding-left: 8px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #6b5e4c;
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>Menü</h1>
      <p>Kafe Adı</p>
    </header>

    <h2 class="section-title">İçecekler</h2>

    <div class="item">
      <img src="icecek-1.webp" alt="İçecek 1" loading="lazy" width="92" height="92">
      <div class="item-info">
        <h3>İçecek Adı 1</h3>
        <p>Kısa açıklama</p>
      </div>
      <div class="price">₺--</div>
    </div>

    <div class="item">
      <img src="icecek-2.webp" alt="İçecek 2" loading="lazy" width="92" height="92">
      <div class="item-info">
        <h3>İçecek Adı 2</h3>
        <p>Kısa açıklama</p>
      </div>
      <div class="price">₺--</div>
    </div>

    <div class="item">
      <img src="icecek-3.webp" alt="İçecek 3" loading="lazy" width="92" height="92">
      <div class="item-info">
        <h3>İçecek Adı 3</h3>
        <p>Kısa açıklama</p>
      </div>
      <div class="price">₺--</div>
    </div>

    <div class="item">
      <img src="icecek-4.webp" alt="İçecek 4" loading="lazy" width="92" height="92">
      <div class="item-info">
        <h3>İçecek Adı 4</h3>
        <p>Kısa açıklama</p>
      </div>
      <div class="price">₺--</div>
    </div>

    <h2 class="section-title">Yemekler</h2>

    <div class="item">
      <img src="yemek-1.webp" alt="Yemek 1" loading="lazy" width="92" height="92">
      <div class="item-info">
        <h3>Yemek Adı 1</h3>
        <p>Kısa açıklama</p>
      </div>
      <div class="price">₺--</div>
    </div>

    <div class="item">
      <img src="yemek-2.webp" alt="Yemek 2" loading="lazy" width="92" height="92">
      <div class="item-info">
        <h3>Yemek Adı 2</h3>
        <p>Kısa açıklama</p>
      </div>
      <div class="price">₺--</div>
    </div>

    <footer>Afiyet olsun ☕</footer>

  </div>
</body>
</html>
